name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: '0.11.29'
      - run: npm ci
      - run: uv sync --locked --extra dev
      - run: npm run check
      - run: npm run package:win
      - run: node scripts/test-packaged.mjs
      - name: Installer checksum
        shell: pwsh
        run: |
          Get-ChildItem local/releases/WileyAI-Setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding utf8 (Join-Path $_.DirectoryName 'SHA256SUMS.txt')
          }
      - uses: actions/upload-artifact@v4
        with:
          name: WileyAI-Windows-x64
          path: |
            local/releases/WileyAI-Setup-*.exe
            local/releases/SHA256SUMS.txt
      - name: Publish tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($tag -ne "v$packageVersion") { throw 'Tag and package version differ' }
          gh release create $tag local/releases/WileyAI-Setup-*.exe local/releases/SHA256SUMS.txt --title "WileyAI $packageVersion" --generate-notes
