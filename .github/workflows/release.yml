name: Windows release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to build and publish; leave empty for an artifact only
        required: false
        default: ''
        type: string
  push:
    tags: ["v*"]

# Build and tests run with a read-only token; only the publish job can write.
permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    env:
      WILEYAI_VRM_TEST_PATH: ${{ github.workspace }}/assets/avatars/Fairy_Assistant.vrm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: '0.11.29'
      - run: npm ci
      - run: uv sync --locked --extra dev
      - run: npx playwright install chromium
      - run: npm run check
      - run: npm run package:win
      - run: node scripts/test-packaged.mjs
      - name: Installer checksum
        shell: pwsh
        run: |
          Get-ChildItem local/releases/WileyAI-Setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding utf8 (Join-Path $_.DirectoryName 'SHA256SUMS.txt')
          }
      - uses: actions/upload-artifact@v4
        with:
          name: WileyAI-Windows-x64
          path: |
            local/releases/WileyAI-Setup-*.exe
            local/releases/SHA256SUMS.txt

  publish:
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: WileyAI-Windows-x64
          path: local/releases
      - name: Publish tagged version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($tag -ne "v$packageVersion") { throw 'Tag and package version differ' }
          $notes = "docs/releases/$packageVersion.ru.md"
          if (Test-Path -LiteralPath $notes) {
            gh release create $tag "local/releases/WileyAI-Setup-$packageVersion-x64.exe" local/releases/SHA256SUMS.txt --title "WileyAI $packageVersion" --notes-file $notes
          } else {
            gh release create $tag "local/releases/WileyAI-Setup-$packageVersion-x64.exe" local/releases/SHA256SUMS.txt --title "WileyAI $packageVersion" --generate-notes
          }
