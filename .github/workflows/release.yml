name: Windows release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing build tag; artifacts are staged for manual publication
        required: false
        default: ''
        type: string

# Only the owner promotes verified, signed artifacts to Releases.
permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    env:
      WILEYAI_VRM_TEST_PATH: ${{ github.workspace }}/assets/avatars/Fairy_Assistant.vrm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: '0.11.29'
      - run: npm ci
      - run: uv sync --locked --extra dev
      - run: npx playwright install chromium
      - run: npm run check
      - run: npm run package:win
      - run: node scripts/test-packaged.mjs
      - name: Installer checksum
        shell: pwsh
        run: |
          Get-ChildItem local/releases/WileyAI-Setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding utf8 (Join-Path $_.DirectoryName 'SHA256SUMS.txt')
          }
      - uses: actions/upload-artifact@v4
        with:
          name: WileyAI-Windows-x64
          path: |
            local/releases/WileyAI-Setup-*.exe
            local/releases/SHA256SUMS.txt
