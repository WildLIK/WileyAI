name: Check WileyAI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run check
      - run: npm run test:desktop
