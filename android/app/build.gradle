plugins { id 'com.android.application' }

android {
    namespace 'ru.wildlik.wileyai.mobile'
    compileSdk 34
    defaultConfig {
        applicationId 'ru.wildlik.wileyai.mobile'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }
    signingConfigs {
        debug {
            storeFile file('../../local/android-signing/wiley-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
