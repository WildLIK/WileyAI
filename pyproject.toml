[project]
name = "wileyai-core"
version = "0.13.1"
description = "Local-first WileyAI runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "anyio>=4.8,<5",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20",
    "keyring>=25,<26",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "psutil>=6,<8",
    "tzdata>=2026.5",
    "websockets>=15,<18",
    "telethon>=1.45,<2",
    "num2words>=0.5.14,<0.6",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.1,<2", "av>=11,<17"]
tts = ["torch>=2.6,<3", "scipy>=1.15,<2", "numpy>=2,<3"]
piper = ["piper-tts>=1.8,<2"]
dev = ["pytest>=8,<10", "numpy>=2,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "tts" }]
